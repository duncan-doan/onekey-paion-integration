[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "onekey-paion-integration"
version = "0.1.0"
description = "Load IQVIA OneKey HCP/HCO reference data into Dynamics 365 Dataverse"
requires-python = ">=3.11"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7", "openpyxl>=3.1", "pypdf>=3"]

[tool.setuptools]
packages = ["onekey", "dataverse", "integration"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keeps `pytest` working from the repo root without installing the project.
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
